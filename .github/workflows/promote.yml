name: Promote

# Takes main's newest green CI run, runs the runtime image smoke on that exact commit (install.sh, an agent in gVisor answers a
# chat, a release with a failing /health rolls back), then tags the image CI pushed for that commit as `stable`.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: promote
  cancel-in-progress: false

env:
  REPO: ghcr.io/openhuthq/runtime

jobs:
  green:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.green.outputs.sha }}
    steps:
      - name: Main's newest green CI run
        id: green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha -q '.[0].headSha')
          [ -n "$sha" ] || { echo "::error::No main commit has passed CI yet."; exit 1; }
          echo "Promoting ${sha::8}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  smoke:
    needs: green
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runtime-image.yml
    secrets: inherit
    with:
      ref: ${{ needs.green.outputs.sha }}
      tags: ''

  stable:
    needs: [green, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image CI pushed for that commit as stable
        env:
          SHA: ${{ needs.green.outputs.sha }}
        run: |
          docker buildx imagetools create -t "$REPO:stable" "$REPO:$SHA"
          echo "$REPO:stable is $(docker buildx imagetools inspect "$REPO:stable" --format '{{json .Manifest.Digest}}') (${SHA::8})" | tee -a "$GITHUB_STEP_SUMMARY"
