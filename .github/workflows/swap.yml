name: Swap

# install/swap.sh against the runner's Docker: upgrade, rollback, lock, swap from inside, config parity.

on:
  push:
    branches: ['**']
    paths: [install/swap.sh, install/test/swap.test.sh, .github/workflows/swap.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -s sh install/swap.sh install/test/swap.test.sh
      - run: sh install/test/swap.test.sh | tee -a "$GITHUB_STEP_SUMMARY"
