name: Phone live update

on:
  workflow_dispatch:
    inputs:
      app-version:
        description: The phone app version (CFBundleShortVersionString / versionName) this bundle is for
        required: true
        default: '1.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx turbo run typecheck test --filter=@openhut/app
      - run: npm -w @openhut/app run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phone-bundle
          path: packages/app/dist
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: phone-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/sign-phone-bundle.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: phone-bundle
          path: bundle
      - name: Sign the bundle and its manifest
        env:
          PHONE_BUNDLE_KEY: ${{ secrets.PHONE_BUNDLE_KEY }}
          APP_VERSION: ${{ inputs.app-version }}
        run: node scripts/sign-phone-bundle.ts --dir bundle --out signed --sequence "$(date +%s)" --app-version "$APP_VERSION" --updates-url https://cloud.openhut.dev/v1/updates
      - name: Publish to the update host
        env:
          UPDATES_UPLOAD_TOKEN: ${{ secrets.UPDATES_UPLOAD_TOKEN }}
        run: |
          cat signed/manifest.json
          curl -fsS -X PUT -H "authorization: Bearer $UPDATES_UPLOAD_TOKEN" -F 'manifest=<signed/manifest.json' -F 'bundle=@signed/bundle.zip;type=application/zip' https://cloud.openhut.dev/v1/updates
