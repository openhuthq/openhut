name: CI

# The merge gate: OpenHut checked as a web app and a server, Linux only.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: modules
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: No high or critical advisory in what we ship, and the lock resolves only from the npm registry (npm ci already failed if it was out of date)
        run: |
          npm audit --omit=dev --audit-level=high
          ! grep '"resolved":' package-lock.json | grep -v '"https://registry.npmjs.org/\|"packages/'
      - name: install.sh pulls with an empty Docker config, so a saved ghcr.io login that's denied doesn't break the install
        run: |
          t=$(mktemp -d); mkdir "$t/bin" "$t/saved" "$t/tmp"
          echo '{"auths":{"ghcr.io":{"auth":"b3RoZXI6dG9rZW4="}}}' > "$t/saved/config.json"
          # a docker that, like ghcr.io, denies the pull unless it was sent no saved login
          printf '#!/bin/sh\n[ "$1" = --config ] && [ "$(cat "$2/config.json")" = "{}" ] || { echo "error from registry: denied" >&2; exit 1; }\n' > "$t/bin/docker"
          chmod +x "$t/bin/docker"
          PATH="$t/bin:$PATH" DOCKER_CONFIG="$t/saved" TMPDIR="$t/tmp" D=docker sh -c "set -eu; die() { echo \"\$*\"; exit 1; }; $(sed -n '/^pull() {$/,/^}$/p' install/install.sh); pull ghcr.io/openhuthq/openhut@sha256:test"
          [ -z "$(ls -A "$t/tmp")" ] || { echo "::error::pull() left its temporary Docker config behind"; exit 1; }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      - name: Typecheck (a branch runs only the packages it affects; main runs everything)
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then npx turbo run typecheck --cache-dir=.turbo/cache
          else TURBO_SCM_BASE=$(git merge-base origin/main HEAD) npx turbo run typecheck --affected --cache-dir=.turbo/cache; fi

  test:
    # The runtime suite runs one file at a time, so it is split across machines (TEST_SHARD, node --test-shard).
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    env:
      TEST_SHARD: ${{ matrix.shard }}/6
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: modules
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-test-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-test-${{ matrix.shard }}-
      - name: Test this shard (a branch runs only the packages it affects; main runs everything)
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then npx turbo run test --cache-dir=.turbo/cache
          else TURBO_SCM_BASE=$(git merge-base origin/main HEAD) npx turbo run test --affected --cache-dir=.turbo/cache; fi

  browser:
    # The browser run is part of the gate: a fresh dev stack, the web App in Chrome, no sign-in (scripts/web-e2e.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The browser run
        run: OUT=$RUNNER_TEMP/web-e2e scripts/web-e2e.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: ${{ runner.temp }}/web-e2e

  gate:
    needs: [typecheck, test, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do case $result in success|skipped) ;; *) exit 1 ;; esac; done
