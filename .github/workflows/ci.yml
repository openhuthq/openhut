name: CI

# The merge gate: OpenHut checked as a web app and a server, Linux only.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: No high or critical advisory in what we ship, and the lock resolves only from the npm registry (npm ci already failed if it was out of date)
        run: |
          npm audit --omit=dev --audit-level=high
          ! grep '"resolved":' package-lock.json | grep -v '"https://registry.npmjs.org/\|"packages/'
      - name: install.sh pulls with an empty Docker config, so a saved ghcr.io login that's denied doesn't break the install
        run: |
          t=$(mktemp -d); mkdir "$t/bin" "$t/saved" "$t/tmp"
          echo '{"auths":{"ghcr.io":{"auth":"b3RoZXI6dG9rZW4="}}}' > "$t/saved/config.json"
          # a docker that, like ghcr.io, denies the pull unless it was sent no saved login
          printf '#!/bin/sh\n[ "$1" = --config ] && [ "$(cat "$2/config.json")" = "{}" ] || { echo "error from registry: denied" >&2; exit 1; }\n' > "$t/bin/docker"
          chmod +x "$t/bin/docker"
          PATH="$t/bin:$PATH" DOCKER_CONFIG="$t/saved" TMPDIR="$t/tmp" D=docker sh -c "set -eu; die() { echo \"\$*\"; exit 1; }; $(sed -n '/^pull() {$/,/^}$/p' install/install.sh); pull ghcr.io/openhuthq/openhut@sha256:test"
          [ -z "$(ls -A "$t/tmp")" ] || { echo "::error::pull() left its temporary Docker config behind"; exit 1; }
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - name: Typecheck and test (a branch runs only the packages it affects; main runs everything)
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then npx turbo run typecheck test --cache-dir=.turbo/cache
          else TURBO_SCM_BASE=$(git merge-base origin/main HEAD) npx turbo run typecheck test --affected --cache-dir=.turbo/cache; fi
      - uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}

  server:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runtime-image.yml
    secrets: inherit
    with:
      # Every main push pushes the runtime image (tagged by commit), without the slow smoke; Promote (promote.yml) smoke-tests
      # that commit before it tags it stable.
      smoke: false
      tags: ${{ github.sha }}

  browser:
    # The browser run is part of the gate: a fresh dev stack, the web App in Chrome, no sign-in (scripts/web-e2e.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The browser run
        run: OUT=$RUNNER_TEMP/web-e2e scripts/web-e2e.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: ${{ runner.temp }}/web-e2e

  gate:
    needs: [checks, server, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do case $result in success|skipped) ;; *) exit 1 ;; esac; done
