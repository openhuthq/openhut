name: Runtime image

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Space-separated tags to push to ghcr.io/openhuthq/openhut and openhut-runtime (empty builds and smoke-tests only)
        type: string
        default: ''
      smoke:
        description: Install the image from install.sh and run the gVisor chat and the rollback test first
        type: boolean
        default: true
  workflow_call:
    inputs:
      smoke:
        description: Install the image from install.sh and run the gVisor chat and the rollback test first (CI on main skips it; Promote runs it)
        type: boolean
        default: true
      build:
        description: The build number servers see (the version, a leading v is dropped); empty numbers it like scripts/image.sh does
        type: string
        default: ''
      tags:
        description: Space-separated tags to push to ghcr.io/openhuthq/openhut and openhut-runtime, like "0.6.0" (a leading v is dropped)
        type: string
        required: true
      ref:
        description: The commit to build; empty builds the commit the caller runs on
        type: string
        default: ''
    outputs:
      image:
        description: The pushed main image by digest, ghcr.io/openhuthq/openhut@sha256:…, which install.sh pins with its runtime
        value: ${{ jobs.publish.outputs.image }}
      build:
        description: The build number inside the image
        value: ${{ jobs.publish.outputs.build }}

permissions:
  contents: read

concurrency:
  group: runtime-image-${{ github.ref }}-${{ inputs.tags || 'smoke' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPO: ghcr.io/openhuthq

jobs:
  smoke:
    if: inputs.smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Start a local registry
        run: docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: network=host
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - name: Build the image for linux/amd64
        run: |
          start=$(date +%s)
          docker buildx build -f install/Dockerfile --target runtime-base --build-arg AGENT_IMAGE="$(cat install/agent-image)" --platform linux/amd64 \
            -t localhost:5000/openhut/runtime-base:ci --push --cache-from type=gha,scope=runtime-amd64 --cache-to type=gha,scope=runtime-amd64,mode=min .
          echo "Base built in $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
          layer=$(date +%s)
          BUILD="ci-$(git rev-parse --short=8 HEAD)" scripts/image.sh localhost:5000/openhut ci --platform linux/amd64 --push --build-arg BASE=localhost:5000/openhut/runtime-base:ci \
            --cache-from type=gha,scope=runtime-layer --cache-to type=gha,scope=runtime-layer,mode=min
          echo "Both images built and pushed in $(( $(date +%s) - layer ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install it as a server would, from install.sh
        run: |
          start=$(date +%s)
          OPENHUT_MODEL=test sh dist/install.sh
          echo "Installed in $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
          [ "$(docker inspect -f '{{.State.Running}}' openhut-updater)" = true ] || { echo "::error::the updater isn't running"; docker logs openhut-updater; exit 1; }
          [ "$(docker inspect -f '{{.HostConfig.Privileged}}' openhut)" = false ] || { echo "::error::the main container is privileged"; exit 1; }
      - name: The updater clears a request file it can't write, and keeps running
        run: |
          docker run --rm -v openhut-data:/data --entrypoint sh "$(docker inspect -f '{{.Image}}' openhut)" \
            -c 'printf "not-a-request\n" > /data/update/request && chown openhut /data/update/request && chmod 644 /data/update/request'
          i=0; until docker logs openhut-updater 2>&1 | grep -q "ignored an update request"; do i=$((i+1)); [ $i -lt 30 ] || { echo "::error::the updater didn't take the request"; docker logs openhut-updater; exit 1; }; sleep 1; done
          [ "$(docker inspect -f '{{.RestartCount}} {{.State.Running}}' openhut-updater)" = "0 true" ] || { echo "::error::the updater restarted"; docker logs openhut-updater; exit 1; }
      - name: The main install starts its own runtime, and one agent in gVisor on it answers a chat
        run: scripts/image-smoke.sh
      - name: A release whose /health fails is rolled back
        run: |
          good=$(docker inspect -f '{{.Image}}' openhut)
          printf 'FROM localhost:5000/openhut/openhut:ci\nRUN rm /opt/openhut/packages/runtime/src/server/app.ts\n' |
            docker buildx build --platform linux/amd64 --push -t localhost:5000/openhut/openhut:broken --metadata-file broken.json -
          ref="localhost:5000/openhut/openhut@$(sed -n 's/.*"containerimage.digest": *"\(sha256:[0-9a-f]*\)".*/\1/p' broken.json)"
          start=$(date +%s)
          if OPENHUT_IMAGE="$ref" OPENHUT_MODEL=test sh dist/install.sh; then echo "::error::the broken release installed"; exit 1; fi
          [ "$(docker inspect -f '{{.Image}}' openhut)" = "$good" ] || { echo "::error::openhut isn't the previous image"; exit 1; }
          docker exec openhut curl -fsS http://127.0.0.1:8787/health | grep -q '"ok":true'
          echo "A release with a failing /health was rolled back to the previous image in $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Size
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, urllib.request
          for name in ("openhut", "openhut-runtime"):
              get = lambda ref, kind: json.load(urllib.request.urlopen(urllib.request.Request(f"http://127.0.0.1:5000/v2/openhut/{name}/manifests/{ref}", headers={"Accept": kind})))
              index = get("ci", "application/vnd.oci.image.index.v1+json")
              digest = next(m["digest"] for m in index["manifests"] if m["platform"]["architecture"] == "amd64")
              layers = get(digest, "application/vnd.oci.image.manifest.v1+json")["layers"]
              print(f"{name} (linux/amd64): {sum(l['size'] for l in layers) / 1e6:.0f} MB compressed, {len(layers)} layers")
          EOF
          docker image ls --format '{{.Repository}} {{.Size}} (on disk)' | grep openhut >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: |
          docker logs openhut 2>&1 | tail -50 || true
          docker exec openhut sh -c 'tail -n 40 /data/log/*.log' || true
          docker exec openhut-runtime sh -c 'tail -n 80 /var/log/openhut/*.log' || true

  # Each arch builds on its own native runner, no QEMU. openhut pins openhut-runtime by its multi-arch digest, so the
  # runtime images come first, then openhut per arch, then publish joins them under the tags and writes install.sh.
  runtime:
    needs: smoke
    # Runs when the smoke passed or was skipped, never after a failed one.
    if: ${{ !cancelled() && inputs.tags != '' && needs.smoke.result != 'failure' }}
    strategy:
      matrix:
        include: [{ arch: amd64, runner: ubuntu-latest }, { arch: arm64, runner: ubuntu-24.04-arm }]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: A release build sets the runtime version in this checkout
        if: inputs.build != ''
        env:
          BUILD_INPUT: ${{ inputs.build }}
        run: node scripts/set-version.ts "$BUILD_INPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build openhut-runtime for linux/${{ matrix.arch }} and push it by digest
        env:
          BUILD_INPUT: ${{ inputs.build }}
          ARCH: ${{ matrix.arch }}
        run: |
          [ -z "$BUILD_INPUT" ] || export BUILD="${BUILD_INPUT#v}"
          mkdir -p digests
          ONLY=runtime scripts/image.sh "$REPO" "" --platform "linux/$ARCH" --output "type=image,name=$REPO/openhut-runtime,push-by-digest=true,push=true" \
            --cache-from "type=gha,scope=runtime-publish-$ARCH" --cache-to "type=gha,scope=runtime-publish-$ARCH,mode=min" > "digests/runtime-$ARCH"
          cat "digests/runtime-$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-runtime-${{ matrix.arch }}
          path: digests/runtime-${{ matrix.arch }}

  main:
    needs: runtime
    strategy:
      matrix:
        include: [{ arch: amd64, runner: ubuntu-latest }, { arch: arm64, runner: ubuntu-24.04-arm }]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: A release build sets the runtime version in this checkout
        if: inputs.build != ''
        env:
          BUILD_INPUT: ${{ inputs.build }}
        run: node scripts/set-version.ts "$BUILD_INPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-runtime-*
          merge-multiple: true
          path: digests
      - name: Join and tag the openhut-runtime images, then build openhut for linux/${{ matrix.arch }} on them and push it by digest
        env:
          BUILD_INPUT: ${{ inputs.build }}
          TAGS: ${{ inputs.tags }}
          ARCH: ${{ matrix.arch }}
        run: |
          [ -z "$BUILD_INPUT" ] || export BUILD="${BUILD_INPUT#v}"
          tags=; for tag in $TAGS; do tags="$tags -t $REPO/openhut-runtime:${tag#v}"; done
          docker buildx imagetools create $tags $(cat digests/runtime-*)
          first="${TAGS%% *}"
          runtime="$REPO/openhut-runtime@$(docker buildx imagetools inspect "$REPO/openhut-runtime:${first#v}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "$runtime" > digests/runtime
          RUNTIME_IMAGE="$runtime" ONLY=main scripts/image.sh "$REPO" "" --platform "linux/$ARCH" --output "type=image,name=$REPO/openhut,push-by-digest=true,push=true" \
            --cache-from "type=gha,scope=main-publish-$ARCH" --cache-to "type=gha,scope=main-publish-$ARCH,mode=min" > "digests/main-$ARCH"
          cat digests/runtime "digests/main-$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-main-${{ matrix.arch }}
          path: |
            digests/runtime
            digests/main-${{ matrix.arch }}

  publish:
    needs: main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      build: ${{ steps.push.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: A release build sets the runtime version in this checkout
        if: inputs.build != ''
        env:
          BUILD_INPUT: ${{ inputs.build }}
        run: node scripts/set-version.ts "$BUILD_INPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-main-*
          merge-multiple: true
          path: digests
      - name: Join and tag the openhut images, and record the digest
        id: push
        env:
          BUILD_INPUT: ${{ inputs.build }}
          TAGS: ${{ inputs.tags }}
        run: |
          [ -z "$BUILD_INPUT" ] || export BUILD="${BUILD_INPUT#v}"
          tags=; for tag in $TAGS; do tags="$tags -t $REPO/openhut:${tag#v}"; done
          docker buildx imagetools create $tags $(cat digests/main-*)
          first="${TAGS%% *}"
          image="$REPO/openhut@$(docker buildx imagetools inspect "$REPO/openhut:${first#v}" --format '{{json .Manifest}}' | jq -r .digest)"
          runtime=$(cat digests/runtime)
          RUNTIME_IMAGE="$runtime" MAIN_IMAGE="$image" scripts/image.sh "$REPO" "$TAGS" | tee dist-build.txt
          build=$(sed -n 's/.*(build \(.*\))$/\1/p' dist-build.txt)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          printf '%s\n%s\n' "$image" "$runtime" > dist/runtime-image.txt
          echo "Pushed $image and $runtime (build $build, tags $TAGS)" >> "$GITHUB_STEP_SUMMARY"
      - name: Anyone can pull it, as servers do
        run: |
          for image in $(cat dist/runtime-image.txt); do
            DOCKER_CONFIG=$(mktemp -d) docker buildx imagetools inspect "$image" >/dev/null ||
              { echo "::error::$image isn't public. Make the ${image%@*} package public once (package settings), then rerun."; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-image
          path: |
            dist/runtime-image.txt
            dist/install.sh
