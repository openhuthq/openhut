name: Runtime image

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Space-separated tags to push to ghcr.io/openhuthq/runtime (empty builds and smoke-tests only)
        type: string
        default: ''
      smoke:
        description: Install the image from install.sh and run the gVisor chat and the rollback test first
        type: boolean
        default: true
  workflow_call:
    inputs:
      smoke:
        description: Install the image from install.sh and run the gVisor chat and the rollback test first (CI skips it; Promote runs it)
        type: boolean
        default: true
      build:
        description: The build number servers see (the version, a leading v is dropped); empty numbers it like release.sh does
        type: string
        default: ''
      tags:
        description: Space-separated tags to push to ghcr.io/openhuthq/runtime, like "0.6.0" or "edge" (a leading v is dropped)
        type: string
        required: true
      ref:
        description: The commit to build; empty builds the commit the caller runs on
        type: string
        default: ''
    outputs:
      image:
        description: The pushed image by digest, ghcr.io/openhuthq/runtime@sha256:…, for install.sh to pin
        value: ${{ jobs.publish.outputs.image }}
      build:
        description: The build number inside the image
        value: ${{ jobs.publish.outputs.build }}

permissions:
  contents: read

concurrency:
  group: runtime-image-${{ github.ref }}-${{ inputs.tags || 'smoke' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPO: ghcr.io/openhuthq/runtime

jobs:
  smoke:
    if: inputs.smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Check out private/ for the dev cloud the runtime signs in to
        env:
          KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -c url."git@github.com:".insteadOf=https://github.com/ submodule update --init private
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix private/api ci --no-audit --no-fund
      - name: Start the dev cloud and a local registry
        run: |
          (cd private/api && HOST=0.0.0.0 PORT=8793 API_URL=http://127.0.0.1:8793 DEV_SIGN_IN=1 OPENHUT_API_DATA="$RUNNER_TEMP/api" nohup node src/server.ts > "$RUNNER_TEMP/api.log" 2>&1 &)
          docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: network=host
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - name: Build the image for linux/amd64
        run: |
          start=$(date +%s)
          BUILD="ci-$(git rev-parse --short=8 HEAD)" BASE=http://127.0.0.1:8098 scripts/release.sh
          # R7: the base (rebuilt a few times a year), then the thin per-release layer on it, timed on its own (target ≤180 s).
          docker buildx build -f install/Dockerfile --target runtime-base --build-arg AGENT_IMAGE="$(cat install/agent-image)" --platform linux/amd64 \
            -t localhost:5000/openhut/runtime-base:ci --push --cache-from type=gha,scope=runtime-amd64 --cache-to type=gha,scope=runtime-amd64,mode=min dist
          echo "Base built in $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
          layer=$(date +%s)
          scripts/image.sh dist localhost:5000/openhut/runtime:ci --platform linux/amd64 --push --build-arg BASE=localhost:5000/openhut/runtime-base:ci \
            --cache-from type=gha,scope=runtime-layer --cache-to type=gha,scope=runtime-layer,mode=min
          took=$(( $(date +%s) - layer ))
          echo "R7: the layer published in ${took}s (target ≤180 s)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$took" -le 180 ] || echo "::warning::The layer took ${took}s, over R7's 3 minutes."
      - name: Install it as a server would, from install.sh
        run: |
          KEY=$(openssl rand -hex 32) && echo "KEY=$KEY" >> "$GITHUB_ENV" && echo "::add-mask::$KEY"
          (cd dist && nohup python3 -m http.server 8098 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &)
          gw=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          start=$(date +%s)
          OPENHUT_URL=http://127.0.0.1:8098 OPENHUT_MODEL=test OPENHUT_API_URL="http://$gw:8793" OPENHUT_CLOUD_URL="http://$gw:8793" \
            OPENHUT_CLIENT_KEY_SHA256=$(printf %s "$KEY" | sha256sum | cut -c1-64) sh dist/install.sh
          echo "Installed in $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
      - name: One agent in gVisor answers a chat
        run: scripts/image-smoke.sh "$KEY"
      - name: A release whose /health fails is rolled back (R7)
        run: |
          good=$(docker inspect -f '{{.Image}}' openhut)
          printf 'FROM localhost:5000/openhut/runtime:ci\nRUN rm /opt/openhut/packages/runtime/src/server/app.ts\n' |
            docker buildx build --platform linux/amd64 --push -t localhost:5000/openhut/runtime:broken --metadata-file broken.json -
          ref="localhost:5000/openhut/runtime@$(sed -n 's/.*"containerimage.digest": *"\(sha256:[0-9a-f]*\)".*/\1/p' broken.json)"
          sed "s|^RUNTIME_IMAGE=.*|RUNTIME_IMAGE=\"$ref\"|" dist/install.sh > broken-install.sh
          gw=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          start=$(date +%s)
          if OPENHUT_URL=http://127.0.0.1:8098 OPENHUT_MODEL=test OPENHUT_API_URL="http://$gw:8793" OPENHUT_CLOUD_URL="http://$gw:8793" \
            OPENHUT_CLIENT_KEY_SHA256=$(printf %s "$KEY" | sha256sum | cut -c1-64) sh broken-install.sh; then echo "::error::the broken release installed"; exit 1; fi
          [ "$(docker inspect -f '{{.Image}}' openhut)" = "$good" ] || { echo "::error::openhut isn't the previous image"; exit 1; }
          docker exec openhut curl -fsS http://127.0.0.1:8787/health | grep -q '"ok":true'
          echo "R7: a release with a failing /health was rolled back to the previous image in $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Size
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, urllib.request
          get = lambda ref, kind: json.load(urllib.request.urlopen(urllib.request.Request(f"http://127.0.0.1:5000/v2/openhut/runtime/manifests/{ref}", headers={"Accept": kind})))
          index = get("ci", "application/vnd.oci.image.index.v1+json")
          digest = next(m["digest"] for m in index["manifests"] if m["platform"]["architecture"] == "amd64")
          layers = get(digest, "application/vnd.oci.image.manifest.v1+json")["layers"]
          print(f"Image (linux/amd64): {sum(l['size'] for l in layers) / 1e6:.0f} MB compressed, {len(layers)} layers")
          EOF
          docker image ls --format '{{.Repository}} {{.Size}} (on disk)' | grep runtime >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: |
          docker logs openhut 2>&1 | tail -50 || true
          docker exec openhut sh -c 'tail -n 80 /var/log/openhut/*.log' || true
          tail -n 50 "$RUNNER_TEMP/api.log" || true

  publish:
    needs: smoke
    # Runs when the smoke passed or was skipped, never after a failed one.
    if: ${{ !cancelled() && inputs.tags != '' && needs.smoke.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      build: ${{ steps.push.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: A release build sets the runtime version in this checkout
        if: inputs.build != ''
        env:
          BUILD_INPUT: ${{ inputs.build }}
        run: node scripts/set-version.ts "$BUILD_INPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 and linux/arm64, push, and record the digest
        id: push
        env:
          BUILD_INPUT: ${{ inputs.build }}
          TAGS: ${{ inputs.tags }}
        run: |
          start=$(date +%s)
          BUILD="${BUILD_INPUT#v}" scripts/release.sh
          build=$(sed -n 's/^OPENHUT_BUILD="\(.*\)"$/\1/p' dist/install.sh)
          extra=; for tag in $TAGS; do extra="$extra -t $REPO:${tag#v}"; done
          scripts/image.sh dist "$REPO:$build" --platform linux/amd64,linux/arm64 --push $extra \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --cache-from type=gha,scope=runtime-multi --cache-to type=gha,scope=runtime-multi,mode=min
          image=$(sed -n 's/^RUNTIME_IMAGE="${RUNTIME_IMAGE:-\(.*\)}"$/\1/p' dist/install.sh)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$image" > dist/runtime-image.txt
          echo "Pushed $image (build $build, tags $TAGS) in $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Anyone can pull it, as servers do
        run: |
          image=$(cat dist/runtime-image.txt)
          DOCKER_CONFIG=$(mktemp -d) docker buildx imagetools inspect "$image" ||
            { echo "::error::$image isn't public. Make the ghcr.io/openhuthq/runtime package public once (package settings), then rerun."; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-image
          path: |
            dist/runtime-image.txt
            dist/image.json
