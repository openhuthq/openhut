name: Desktop app

on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:
    inputs:
      full:
        description: Sign, notarize and run the update test (always on for a tag)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAGGED: ${{ startsWith(github.ref, 'refs/tags/') }}
  FULL: ${{ startsWith(github.ref, 'refs/tags/') || inputs.full }}
  OPENHUT_INSTALL_URL: ${{ startsWith(github.ref, 'refs/tags/') && format('https://github.com/{0}/releases/download/{1}/install.sh', github.repository, github.ref_name) || 'https://openhut.dev/edge' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
      server: ${{ steps.paths.outputs.server }}
      private: ${{ steps.paths.outputs.private }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pick the jobs a branch needs (main and tags run everything); only docs, the site, the brain or the cloud Worker skip the desktops
        id: paths
        env:
          KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          set -o pipefail
          all() { printf 'desktop=true\nserver=true\nprivate=true\n' >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$GITHUB_EVENT_NAME" = push ] && [ "$TAGGED" != true ] && [ "$GITHUB_REF_NAME" != main ] || all
          base=$(git merge-base origin/main HEAD) || all
          git cat-file -e "$base^{commit}" 2>/dev/null || all
          changed=$(git diff --name-only "$base" HEAD) || all
          if echo "$changed" | grep -qx private; then
            echo private=true >> "$GITHUB_OUTPUT"
            old=$(git ls-tree "$base" private | awk '{print $3}') new=$(git ls-tree HEAD private | awk '{print $3}')
            mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            git -c url."git@github.com:".insteadOf=https://github.com/ submodule update --init private || all
            inside=$(git -C private diff --name-only "$old" "$new" | sed 's|^|private/|') || all
            changed=$(printf '%s\n%s\n' "$(echo "$changed" | grep -vx private)" "$inside")
          fi
          echo "$changed"
          desktop=$(echo "$changed" | grep -Ev '^$|\.md$|^docs/|^packages/docs/|^packages/phone/|^\.agents/|^private/(site|brain|cloud)/|^\.github/workflows/(deploy|cloud|phone)\.yml$' || true)
          server=$(echo "$changed" | grep -E '^(install|packages/runtime|packages/common|packages/tunnel|vendor|private/api)/|^package-lock\.json$|^scripts/(release|image|image-smoke)\.sh$|^\.github/workflows/(runtime-image|desktop)\.yml$' || true)
          echo "Needs the desktops: ${desktop:-nothing}"
          echo "Needs the server image: ${server:-nothing}"
          echo "desktop=$([ -n "$desktop" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "server=$([ -n "$server" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  private:
    needs: changes
    if: needs.changes.outputs.private == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out private/
        env:
          KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -c url."git@github.com:".insteadOf=https://github.com/ submodule update --init private
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The cloud API, the cloud Worker and the site typecheck and pass their tests
        run: |
          npm --prefix private/api run typecheck && npm --prefix private/api test
          npm --prefix private/cloud run typecheck && npm --prefix private/cloud test
          npm --prefix private/site run typecheck

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true' && !startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runtime-image.yml
    secrets: inherit
    with:
      tags: ''

  draft:
    environment: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.full) && 'release' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Signing and notary secrets are set
        if: env.FULL == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=
          for name in CSC_LINK CSC_KEY_PASSWORD NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [ -n "$(printenv "$name")" ] || { echo "::error::The repo secret $name isn't set. A release is never built without the Developer ID and notarization."; missing=1; }
          done
          [ -z "$missing" ]
      - name: Tag matches the app version, and servers will see it as newer
        if: env.TAGGED == 'true'
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/desktop/package.json').version")"
          served=$(curl -fsSL https://openhut.dev/ | sed -n 's/^OPENHUT_BUILD="\(.*\)"$/\1/p')
          [ -z "$served" ] || [ "$(printf '%s\n%s\n' "$served" "${GITHUB_REF_NAME#v}" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" = "${GITHUB_REF_NAME#v}" ] && [ "$served" != "${GITHUB_REF_NAME#v}" ] ||
            { echo "::error::openhut.dev serves runtime build $served, and ${GITHUB_REF_NAME#v} isn't newer, so servers would never be offered this release. Use a higher version."; exit 1; }
      - name: Cloudflare takes uploads past wrangler's 300 MB limit
        if: env.TAGGED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/r2.sh check
      - name: The tag has an unpublished draft release for every build to upload into
        if: env.TAGGED == 'true'
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then
            echo "::error::$GITHUB_REF_NAME is already published, and a published release never changes. Bump the version instead."
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --prerelease="$(case "$GITHUB_REF_NAME" in *-*) echo true ;; *) echo false ;; esac)" --title "OpenHut ${GITHUB_REF_NAME#v}" --notes ""

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - run: npx turbo run typecheck test --cache-dir=.turbo/cache
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}

  build:
    needs: [draft, changes]
    if: needs.changes.outputs.desktop == 'true'
    environment: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.full) && 'release' || '' }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-26 }
          - { name: windows, os: windows-2022 }
          - { name: linux, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: packages/desktop/dist/native-cache
          key: native-runtime-${{ runner.os }}-${{ hashFiles('install/native-runtime.json', 'packages/desktop/scripts/pack-hermes.mjs') }}
      - uses: actions/cache/restore@v4
        id: electron-cache
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Build and sign the app
        if: matrix.name == 'macos' && env.FULL == 'true'
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build && npm run pack-backend && npm run sums && npx electron-builder --mac --arm64 --publish never
      - name: Build the app unsigned
        if: matrix.name == 'macos' && env.FULL != 'true'
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build && npm run pack-backend && npm run sums && npx electron-builder --mac --arm64 --publish never && codesign --force --deep --sign - release/mac-arm64/OpenHut.app
      - name: Notarize, staple and check Gatekeeper
        if: matrix.name == 'macos' && env.FULL == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: packages/desktop/scripts/notarize.sh
      - name: Signed so the release before it accepts it
        if: matrix.name == 'macos' && env.FULL == 'true'
        working-directory: packages/desktop
        run: |
          mkdir -p previous/zip previous/app
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'OpenHut-*-arm64.zip' --dir previous/zip
          ditto -x -k previous/zip/*.zip previous/app
          requirement=$(codesign -d -r- previous/app/OpenHut.app 2>&1 | sed -n 's/^designated => //p')
          echo "The previous release requires: $requirement"
          mkdir -p shipped && ditto -x -k release/OpenHut-*-arm64.zip shipped
          for app in release/mac-arm64/OpenHut.app shipped/OpenHut.app; do codesign --verify --deep --strict -R "=$requirement" "$app"; done
      - name: Check out private/ and install the cloud API the update test and app e2e sign in to
        shell: bash
        env:
          KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -c url."git@github.com:".insteadOf=https://github.com/ submodule update --init private
      - uses: actions/cache@v4
        id: api-modules
        with:
          path: private/api/node_modules
          key: private-api-${{ runner.os }}-${{ hashFiles('private/api/package-lock.json') }}
      - if: steps.api-modules.outputs.cache-hit != 'true'
        run: npm --prefix private/api ci --no-audit --no-fund
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: packages/desktop/dist/native-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.electron-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}
      - name: The previous version updates to this one
        if: matrix.name == 'macos' && env.FULL == 'true'
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npx electron-builder --mac zip --arm64 -c.extraMetadata.version=0.0.1 -c.directories.output=release-old --publish never
          mkdir -p feed && cp release/latest-mac.yml release/OpenHut-*-arm64.zip release/OpenHut-*-arm64.zip.blockmap release/OpenHut-arm64.dmg feed/
          node scripts/update-test.mjs --from release-old/mac-arm64/OpenHut.app --feed feed --via button --cloud ../../private/api
          node scripts/update-test.mjs --from release-old/mac-arm64/OpenHut.app --feed feed --via quit --cloud ../../private/api
      - name: Add the Mac app to the draft release
        if: matrix.name == 'macos' && env.TAGGED == 'true'
        working-directory: packages/desktop/release
        run: gh release upload "$GITHUB_REF_NAME" OpenHut-arm64.dmg OpenHut-*-arm64.zip OpenHut-*-arm64.zip.blockmap latest-mac.yml ../dist/SHA256SUMS --clobber

      - name: Build the installer
        if: matrix.name == 'windows'
        working-directory: packages/desktop
        run: npm run dist:win
      - name: The WhatsApp bridge is in every stage of the build
        if: matrix.name == 'windows'
        shell: bash
        working-directory: packages/desktop
        run: |
          for dir in dist/native-cache/hermes/*/hermes/scripts/whatsapp-bridge dist/backend/runtime/hermes/scripts/whatsapp-bridge release/win-unpacked/resources/backend/runtime/hermes/scripts/whatsapp-bridge; do
            echo "$dir: $(ls $dir 2>&1 | head -5 | tr '\n' ' ') node_modules: $(ls $dir/node_modules 2>/dev/null | wc -l)"
          done
      - name: Install it, sign in, meet the first agent, run five at once, chat, restart, and keep the evidence
        if: matrix.name == 'windows'
        working-directory: packages/desktop
        run: node scripts/app-e2e.mjs --installer release/OpenHut-Setup-x64.exe --out app-e2e --cloud ../../private/api
      - name: Open it, sign in, meet the first agent, run five at once, chat, restart, and keep the evidence
        if: matrix.name == 'macos'
        working-directory: packages/desktop
        run: node scripts/app-e2e.mjs --app release/mac-arm64/OpenHut.app --out app-e2e --cloud ../../private/api
      - name: Build the AppImage and deb, and add them to the draft release
        if: matrix.name == 'linux'
        working-directory: packages/desktop
        run: umask 022 && npm run build && npm run pack-backend && npx electron-builder --linux --x64 -c.electronFuses.runAsNode=true --publish "$([ "$TAGGED" = true ] && echo always || echo never)"
      - name: Open it, sign in, meet the first agent, run five at once, chat, restart, and keep the evidence
        if: matrix.name == 'linux'
        working-directory: packages/desktop
        run: |
          sudo apt-get install -y -qq xvfb
          status=0; xvfb-run -a -s "-screen 0 1280x800x24" node scripts/app-e2e.mjs --app release/linux-unpacked --out /tmp/e2e --cloud ../../private/api || status=$?
          mkdir -p app-e2e && cp -R /tmp/e2e/. app-e2e/
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-e2e
          path: |
            packages/desktop/app-e2e/*.png
            packages/desktop/app-e2e/evidence.json
            packages/desktop/app-e2e/home/logs/
            packages/desktop/app-e2e/home/data/native/*/agent.log
      - name: Add the installer to the draft release
        if: matrix.name == 'windows' && env.TAGGED == 'true'
        working-directory: packages/desktop/release
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" OpenHut-Setup-x64.exe OpenHut-Setup-x64.exe.blockmap latest.yml --clobber

  runtime-image:
    needs: draft
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runtime-image.yml
    secrets: inherit
    with:
      build: ${{ github.ref_name }}
      tags: ${{ github.ref_name }}

  server-runtime:
    needs: runtime-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add the server runtime of the same commit, pinned to its image, to the draft release
        env:
          IMAGE: ${{ needs.runtime-image.outputs.image }}
        run: |
          case "$IMAGE" in ghcr.io/openhuthq/runtime@sha256:*) ;; *) echo "::error::The runtime image workflow gave no image digest ($IMAGE)."; exit 1 ;; esac
          BUILD="${GITHUB_REF_NAME#v}" TGZ="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/openhut.tgz" scripts/release.sh
          sh -n dist/install.sh
          grep -qxF "RUNTIME_IMAGE=\"\${RUNTIME_IMAGE:-$IMAGE}\"" dist/install.sh
          gh release upload "$GITHUB_REF_NAME" dist/install.sh dist/openhut.tgz --clobber

  gate:
    needs: [changes, private, server, draft, checks, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do case $result in success|skipped) ;; *) exit 1 ;; esac; done

  publish:
    needs: [checks, build, server-runtime]
    if: startsWith(github.ref, 'refs/tags/')
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Every file is there, sign them, then put them on dl.openhut.dev and publish the release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          have=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          v="${GITHUB_REF_NAME#v}"
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::The release environment has no RELEASE_SIGNING_KEY, and the app refuses an unsigned update."; exit 1; }
          for want in OpenHut-arm64.dmg "OpenHut-$v-arm64.zip" "OpenHut-$v-arm64.zip.blockmap" latest-mac.yml OpenHut-x64.AppImage openhut-x64.deb latest-linux.yml OpenHut-Setup-x64.exe latest.yml install.sh openhut.tgz SHA256SUMS; do
            echo "$have" | grep -qx "$want" || { echo "::error::The draft release has no $want, so it stays a draft."; exit 1; }
          done
          gh release download "$GITHUB_REF_NAME" --dir r2
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.pem")
          RELEASE_KEY="$RUNNER_TEMP/release.pem" scripts/release.sh sign r2
          rm "$RUNNER_TEMP/release.pem"
          gh release upload "$GITHUB_REF_NAME" r2/release.json r2/release.json.sig --clobber
          scripts/r2.sh release "$v" r2
          gh release edit "$GITHUB_REF_NAME" --draft=false
          image=$(sed -n 's/^RUNTIME_IMAGE="${RUNTIME_IMAGE:-\(.*\)}"$/\1/p' r2/install.sh)
          docker buildx imagetools create -t "ghcr.io/openhuthq/runtime:$(case "$v" in *-*) echo beta ;; *) echo latest ;; esac)" "$image"
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
