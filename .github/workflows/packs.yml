name: Packs

# R2: the app, runtime and native packs (scripts/pack.ts), built and timed on Linux (target ≤5 min). Not signed or published yet (R4).
# ci.yml calls it on main pushes; the packs come back as the `packs` artifact.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag to build, like v0.7.0; it also sets the app and runtime version. Empty builds the calling commit
        type: string
        default: ''
  # R8, dry: build the packs, sign them with a throwaway test key, and list what a normal release would publish. Publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - if: inputs.ref != ''
        run: node scripts/set-version.ts "${{ inputs.ref }}"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: packages/desktop/dist/native-cache
          key: native-runtime-${{ runner.os }}-${{ hashFiles('install/native-runtime.json', 'packages/desktop/scripts/pack-hermes.mjs') }}
      - name: Build the packs
        run: |
          umask 022
          npm -w @openhut/desktop run build && npm -w @openhut/desktop run pack-backend && node scripts/pack.ts packs
          ls -l packs
          { echo "Packs built in $(( $(date +%s) - START ))s from checkout (target 300s)"; echo '```'; shasum -a 512 packs/*.tgz; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
      - name: Dry release (test key, nothing published)
        if: github.event_name == 'workflow_dispatch'
        run: |
          key=$(node scripts/release-key.ts key "$RUNNER_TEMP/test.pem")
          # ci.yml's beta pins the image its server job pushed; a dry run pins a stand-in digest.
          IMAGE=ghcr.io/openhuthq/runtime@sha256:$(printf dry | sha256sum | cut -c1-64) BUILD=dry BASE=https://openhut.dev/install.sh TGZ='https://dl.openhut.dev/packs/@SHA512@' scripts/release.sh
          cp dist/install.sh dist/openhut.tgz packs/
          node scripts/release-key.ts sign "$RUNNER_TEMP/test.pem" packs "$(node -p "require('./packages/desktop/package.json').version")" --channel beta
          node -e 'const f = require("./packs/release.json").files, h = (n) => require("crypto").createHash("sha512").update(require("fs").readFileSync("packs/" + n)).digest("base64")
            for (const n of ["install.sh", "openhut.tgz"]) if (f[n] !== h(n)) throw new Error(`release.json does not sign ${n}`)'
          grep -q "^OPENHUT_TGZ=\"https://dl.openhut.dev/packs/$(shasum -a 512 packs/openhut.tgz | cut -d' ' -f1)\"$" packs/install.sh
          { echo "Dry release, signed by a test key ($key), PUBLISH_PACKS untouched. release.json signs install.sh and openhut.tgz. A normal release would upload only:"; echo '```'
            for f in packs/openhut-* packs/install.sh packs/openhut.tgz; do echo "packs/$(shasum -a 512 "$f" | cut -d' ' -f1)  ($(basename "$f"), $(wc -c < "$f") bytes)"; done
            echo 'channels/beta/release.json, .sig, .rekor, install.sh; releases/<sha256>.json, .sig, .rekor'; echo '```'
            grep -E '^(OPENHUT_URL|OPENHUT_BUILD|OPENHUT_TGZ|RUNTIME_IMAGE)=' packs/install.sh; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: packs
          retention-days: 7
