name: Server e2e

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Check out private/ for the dev cloud, its relay and the release mirror
        env:
          KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -c url."git@github.com:".insteadOf=https://github.com/ submodule update --init private
      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for dir in site cloud api; do npm --prefix "private/$dir" ci --no-audit --no-fund; done
      - name: Make room for the server's Docker images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: The whole run (install, cloud, tampered upgrade, upgrade, restart, update)
        run: |
          start=$(date +%s)
          status=0; npm run e2e:server || status=$?
          echo "Ran in $(( ($(date +%s) - start) / 60 )) min" >> "$GITHUB_STEP_SUMMARY"
          [ ! -f packages/e2e/results/e2e-report.md ] || cat packages/e2e/results/e2e-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: server-e2e-results
          path: packages/e2e/results/
          if-no-files-found: warn
