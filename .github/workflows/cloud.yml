name: Cloud

on:
  workflow_run:
    # CI: main's green pushes (when private/ changed). Promote: stable moved, so the image's App (R5: stable's) must follow.
    workflows: [CI, Promote]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: cloud
  cancel-in-progress: false

jobs:
  changed:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.name == 'Promote'))
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.since.outputs.deploy }}
      sha: ${{ steps.since.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Main's newest green commit, deployed only when private/ or packages/common changed since the last deploy and never older than it
        id: since
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha -q '.[0].headSha')
          [ -n "$sha" ] || { echo "::error::No main commit has passed CI yet."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=cloud-deployed&per_page=1" -q '.artifacts[0].workflow_run.id // ""')
          last=$([ -n "$run" ] && gh run download "$run" --repo "$GITHUB_REPOSITORY" -n cloud-deployed -D "$RUNNER_TEMP/last" >/dev/null && cat "$RUNNER_TEMP/last/deployed.txt" || true)
          echo "Newest green: ${sha::8}; last deployed: ${last:-none}"
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then echo deploy=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$WORKFLOW" = Promote ]; then
            halt=$(curl -fsS https://dl.openhut.dev/channels/stable/release.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).halt')
            echo "Promote moved stable (halt: $halt); a halt keeps the App that is live."
            echo "deploy=$([ "$halt" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$sha" = "$last" ] || git merge-base --is-ancestor "$sha" "$last"; then echo "${sha::8} is already live or older than what is."; echo deploy=false >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && { echo deploy=true >> "$GITHUB_OUTPUT"; exit 0; }
          changed=$(git diff --name-only "$last" "$sha" -- private packages/common .github/workflows/cloud.yml)
          echo "Since ${last::8}: ${changed:-nothing}"
          echo "deploy=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changed
    if: needs.changed.outputs.deploy == 'true'
    environment: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changed.outputs.sha }}
      - name: Check out private/
        env:
          KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -c url."git@github.com:".insteadOf=https://github.com/ submodule update --init private
          rm ~/.ssh/id_ed25519
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install kamal -v 2.12.0
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CLOUD_SSH_KEY }}
      - run: ssh-keyscan -t ed25519 46.224.128.49 >> ~/.ssh/known_hosts
      - name: The signed stable release whose App the image serves (R5; the build refuses any other)
        run: private/api/deploy/fetch-release.sh
      - name: Kamal deploy
        env:
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: kamal deploy -c private/api/deploy/kamal.yml
      - name: Record the sha now live, for the next run's comparison
        run: echo "$SHA" > deployed.txt
        env:
          SHA: ${{ needs.changed.outputs.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-deployed
          path: deployed.txt
          retention-days: 90
