name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runtime-image.yml
    secrets: inherit
    with:
      tags: edge

  deploy:
    needs: [test, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out private/
        env:
          KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -c url."git@github.com:".insteadOf=https://github.com/ submodule update --init private
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix private/site run typecheck && npm --prefix private/cloud run typecheck && npm --prefix private/cloud test
      - name: Release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          BUILD: ${{ needs.image.outputs.build }}
        run: |
          set -o pipefail
          if names=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q '.assets[].name' 2>err.txt); then :
          elif grep -q 'HTTP 404' err.txt; then names=''
          else cat err.txt >&2; echo "Couldn't read the latest GitHub release, so openhut.dev isn't changed." >&2; exit 1; fi
          if echo "$names" | grep -qx install.sh; then
            echo "openhut.dev/ sends curl to the latest GitHub release's installer"
          else
            OUT=dist/site scripts/release.sh
          fi
          OUT=dist/site/edge BASE=https://openhut.dev/edge scripts/release.sh
      - name: Deploy openhut.dev
        run: npm --prefix private/site run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy cloud.openhut.dev
        run: |
          cd private/cloud
          npx wrangler r2 bucket info openhut-files > /dev/null 2>&1 || npx wrangler r2 bucket create openhut-files
          CI=1 npx wrangler d1 migrations apply openhut-stats --remote
          npm run deploy
          npx wrangler secret list | grep -q '"BETTER_AUTH_SECRET"' || echo "::warning::BETTER_AUTH_SECRET isn't set on openhut-cloud, so cloud sign-in answers 503. Run: npx wrangler secret put BETTER_AUTH_SECRET (in private/cloud)."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check that openhut.dev serves this release
        run: |
          check() {
            want=$(sed -n 's/^OPENHUT_SHA256="\([0-9a-f]*\)"$/\1/p' "dist/site/$1install.sh")
            for i in 1 2 3 4 5 6; do
              got=$(curl -fsS "https://openhut.dev/$1openhut.tgz" | sha256sum | cut -d' ' -f1)
              served=$(curl -fsSL "https://openhut.dev/$2" | sed -n 's/^OPENHUT_SHA256="\([0-9a-f]*\)"$/\1/p')
              [ "$got" = "$want" ] && [ "$served" = "$want" ] && return 0
              sleep 10
            done
            echo "openhut.dev/$2 doesn't serve this release yet." >&2; return 1
          }
          check edge/ edge
          if [ -f dist/site/install.sh ]; then check '' ''
          else curl -fsSL https://openhut.dev/ | grep -q '^OPENHUT_BUILD='; fi
          curl -fsS -H 'accept: text/html' https://openhut.dev/ | grep -q '<html'
