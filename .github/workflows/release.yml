name: Cut a shell release

# Tags a version and packages the shell (installers, notarization) from it. The normal release is Promote (promote.yml): packs from main,
# re-signed as stable. R9 removes this workflow.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Both tag the newest main commit that passed CI; the release run sets the version, nothing is committed
        type: choice
        options: [stable, beta]
        default: stable
      version:
        description: The new version, like 0.5.0 (stable) or 0.5.0-beta.2 (beta)
        type: string
        required: true
      shell:
        description: Also package the shell (installers, notarization, app e2e, update test) and publish the release with it. Until packs ship (scripts/pack.ts), a release has nothing else to publish
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The version fits the channel and is higher than every release before it
        run: |
          git fetch --tags --force --quiet
          git tag -l 'v*' | node -e '
            const { CHANNEL, VERSION } = process.env
            const parse = (v) => {
              const m = /^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/.exec(v)
              return m && [+m[1], +m[2], +m[3], m[4] === undefined ? Infinity : +m[4]]
            }
            const cmp = (a, b) => a.reduce((d, x, i) => d || (x > b[i]) - (x < b[i]), 0)
            const fail = (message) => { console.log(`::error::${message}`); process.exit(1) }
            const want = parse(VERSION)
            if (!want) fail(`${VERSION} is not a version like 0.5.0 or 0.5.0-beta.2.`)
            if (CHANNEL === "beta" && want[3] === Infinity) fail(`A beta needs a -beta.N part, like ${VERSION}-beta.1.`)
            if (CHANNEL === "stable" && want[3] !== Infinity) fail(`A stable has no -beta part; use the beta channel for ${VERSION}.`)
            const tags = require("fs").readFileSync(0, "utf8").split("\n").map((t) => t.slice(1)).filter(parse)
            const stables = tags.filter((t) => !t.includes("-"))
            const above = CHANNEL === "beta" ? tags : stables
            const top = above.sort((a, b) => cmp(parse(a), parse(b))).at(-1)
            if (top && cmp(want, parse(top)) <= 0) fail(`v${VERSION} is not higher than v${top}.`)
            console.log(`v${VERSION} is higher than ${top ? `v${top}` : "no release"}.`)
          '
      - name: Find main's newest commit that passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r sha url <<< "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha,url -q '.[0] | "\(.headSha) \(.url)"')"
          [ -n "$sha" ] || { echo "::error::No commit on main has passed CI yet, so there's nothing releasable."; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::${sha::8} passed CI but isn't on main any more."; exit 1; }
          behind=$(git rev-list --count "$sha..origin/main")
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "Tagging ${sha::8}, which passed $url ($behind newer commits on main aren't green yet)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push the tag
        env:
          RELEASE_TAG_KEY: ${{ secrets.RELEASE_TAG_KEY }}
        run: |
          git tag "v$VERSION" "$SHA"
          printf '%s\n' "$RELEASE_TAG_KEY" > "$RUNNER_TEMP/tag-key" && chmod 600 "$RUNNER_TEMP/tag-key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tag-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/v$VERSION"
          rm "$RUNNER_TEMP/tag-key"
          echo "Pushed v$VERSION at ${SHA::8}" >> "$GITHUB_STEP_SUMMARY"
      # Signing and publishing the packs built by the `packs` job below is R4. That is the normal release;
      # once it ships, `shell` defaults to false and the shell is packaged only when it changes.
      - name: Package the shell on the tag, which signs, uploads and publishes the release
        if: inputs.shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run shell.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"
          echo "Packaging the shell for v$VERSION: https://github.com/$GITHUB_REPOSITORY/actions/workflows/shell.yml" >> "$GITHUB_STEP_SUMMARY"

  packs:
    needs: cut
    uses: ./.github/workflows/packs.yml
    with:
      ref: v${{ inputs.version }}
