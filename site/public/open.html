<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="icon" href="/hut.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<title>Open in OpenHut</title>
<style>
:root{--paper:#fff;--ink:#0b0b0c;--body:#3a3a40;--muted:#6b6b73;--line:rgb(0 0 0 / .12);--soft:rgb(0 0 0 / .04);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0e0e10;--ink:#f4f4f6;--body:#c9c9cf;--muted:#8d8d95;--line:rgb(255 255 255 / .14);--soft:rgb(255 255 255 / .06);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--paper);color:var(--body);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px;padding:48px 16px;text-align:center}
img{width:84px;height:84px}
h1{margin:6px 0 0;color:var(--ink);font-size:22px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
p{margin:0}
a.button{display:flex;align-items:center;justify-content:center;width:100%;max-width:300px;height:40px;border-radius:10px;font-weight:600;text-decoration:none}
.open{margin-top:8px;background:var(--ink);color:var(--paper)}
.broken{display:none}
.missing .broken{display:block}
.missing .whole{display:none}
</style>
</head>
<body><main>
<img src="/hut.svg" alt="">
<h1>Your agent needs an app</h1>
<p class="whole">Open OpenHut to connect it. Your agent can use it once you do.</p>
<p class="broken">This link is missing what to connect. Copy the whole link from your agent and open it again.</p>
<a class="button open whole" id="open" href="https://app.openhut.dev">Open OpenHut</a>
</main>
<script>
const hash = location.hash
if (/^#\/connections\/new\/[a-z_]+\?[^#]*$/.test(hash)) {
  const link = 'https://app.openhut.dev' + hash.slice(1)
  document.getElementById('open').href = link
  location.replace(link)
} else document.body.classList.add('missing')
</script>
</body>
</html>
